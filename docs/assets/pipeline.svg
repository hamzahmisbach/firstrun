#eff1ea" stroke="#444d47" stroke-width="1.6" stroke-dasharray="5 4"/></g><text x="723" y="330" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#444d47" letter-spacing="0.9">AI MODEL</text><text x="723" y="350" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="700" fill="#161a17">Explanation</text><text x="723" y="368" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">Plain words from the</text><text x="723" y="383" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">findings, never a verdict</text><text x="292" y="336" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#6b3b00" text-anchor="end" class="a16">Second run: one more try</text><text x="292" y="355" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" fill="#444d47" text-anchor="end" class="a16">if the code looks like it is waiting</text><text x="292" y="372" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" fill="#444d47" text-anchor="end" class="a16">for something. Fixed menu only.</text><g class="a17"><rect x="338" y="176" width="46" height="20" rx="0" fill="#fbf0d8" stroke="#e4c78a" stroke-width="1"/><text x="361" y="190" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b3b00" text-anchor="middle">2nd</text></g><g class="a18"><rect x="522" y="176" width="58" height="20" rx="0" fill="#fbf0d8" stroke="#e4c78a" stroke-width="1"/><text x="551" y="190" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b3b00" text-anchor="middle">again</text></g><rect x="24" y="413" width="12" height="12" rx="0" fill="#161a17"/><text x="44" y="424" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" fill="#444d47">Fixed code: same input, same result</text><rect x="300" y="413" width="12" height="12" rx="0" fill="#15693a"/><text x="320" y="424" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" fill="#444d47">Really executed, recorded from outside</text><rect x="620" y="413" width="12" height="12" rx="0" fill="#444d47"/><text x="640" y="424" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" fill="#444d47">Dashed: an AI model, cannot lower a verdict</text></svg>
