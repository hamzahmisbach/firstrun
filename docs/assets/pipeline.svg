&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">with plain string code</text><rect x="220" y="168" width="172" height="84" rx="0" fill="#fdfdfb" stroke="#cdd3c9" stroke-width="1"/><g class="a10"><rect x="220" y="168" width="172" height="84" rx="0" fill="#e4f3e6" stroke="#15693a" stroke-width="1.6"/></g><text x="232" y="190" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#15693a" letter-spacing="0.9">REAL RUN</text><text x="232" y="210" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="700" fill="#161a17">Sandbox run</text><text x="232" y="228" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">The command as pasted,</text><text x="232" y="243" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">on a fake laptop</text><rect x="416" y="168" width="172" height="84" rx="0" fill="#fdfdfb" stroke="#cdd3c9" stroke-width="1"/><g class="a11"><rect x="416" y="168" width="172" height="84" rx="0" fill="#fdfdfb" stroke="#161a17" stroke-width="1.6"/></g><text x="428" y="190" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#161a17" letter-spacing="0.9">FIXED CODE</text><text x="428" y="210" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="700" fill="#161a17">Rules</text><text x="428" y="228" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">What happened against</text><text x="428" y="243" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">what was expected</text><rect x="612" y="168" width="172" height="84" rx="0" fill="#fdfdfb" stroke="#cdd3c9" stroke-width="1"/><g class="a12"><rect x="612" y="168" width="172" height="84" rx="0" fill="#fdfdfb" stroke="#161a17" stroke-width="1.6"/></g><text x="624" y="190" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#161a17" letter-spacing="0.9">FIXED CODE</text><text x="624" y="210" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="700" fill="#161a17">Verdict</text><text x="624" y="228" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">Clean, Suspicious or</text><text x="624" y="243" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" fill="#444d47">Malicious</text><rect x="804" y="168" width="172" height="84" rx="0" fill="#fdfdfb" stroke="#cdd3c9" stroke-width="1"/><g class="a13"><rect x="804" y="168" width="172" height="84" rx="0" fill="#fdfdfb" stroke="#161a17" stroke-width="1.6"/></g><text x="816" y="190" font-family="&quot;IBM Plex Sans&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#161a17" letter-spacing="0.9">FIXED CODE</text><text x="816" y="210" font-