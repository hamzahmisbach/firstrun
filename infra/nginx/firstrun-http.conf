# Port 80: answers Let's Encrypt and sends everyone else to HTTPS.
# Rendered by infra/setup-https.sh: __FIRSTRUN_HOSTNAME__ is replaced with the public hostname.

# Requests that do not name our hostname (scanners hitting the IP) get the connection closed.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __FIRSTRUN_HOSTNAME__;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://__FIRSTRUN_HOSTNAME__$request_uri;
    }
}
