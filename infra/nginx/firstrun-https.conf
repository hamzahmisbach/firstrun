# Port 443: the only public way in. The orchestrator itself listens on 127.0.0.1:3000.
# Rendered by infra/setup-https.sh once the certificate exists: __FIRSTRUN_HOSTNAME__ is replaced
# with the public hostname.

upstream firstrun_orchestrator {
    server 127.0.0.1:3000;
    # nginx drops idle sockets after 60 s, before the orchestrator's 125 s keep-alive runs out.
    keepalive 16;
}

# Connections that do not name our hostname get no certificate and no page.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __FIRSTRUN_HOSTNAME__;
    # The orchestrator's request log in journald (kept 7 days) is the only record of requests.
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/__FIRSTRUN_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FIRSTRUN_HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:firstrun_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout 15s;
    # The orchestrator refuses bodies over 64 KiB with its own JSON error, which the page can show.
    # This limit only stops anything much bigger before it gets that far.
    client_max_body_size 128k;

    # The orchestrator already sends nosniff; hide its copy so the header appears once.
    proxy_hide_header X-Content-Type-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Replaces whatever the client sent: rate limits key on this value (server/http/ratelimit.mjs).
    proxy_set_header X-Forwarded-For $remote_addr;

    location / {
        proxy_pass http://firstrun_orchestrator;
    }

    # Live run events: pass each one on at once. The 15 s heartbeat keeps the connection open.
    location ~ ^/api/runs/[^/]+/events$ {
        proxy_pass http://firstrun_orchestrator;
        proxy_buffering off;
        gzip off;
    }
}
